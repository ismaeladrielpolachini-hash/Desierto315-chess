<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#080d18">
<title>DESIERTO315.CHESS</title>
<style>
:root{--bg:#070b13;--panel:#101827;--panel2:#152238;--blue:#168cff;--cyan:#48d7ff;--text:#eef6ff;--muted:#91a4bd;--line:#233651;--gold:#ffd36a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#12345a 0,transparent 48%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:0;color:inherit}
.top{height:66px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1c2d45;background:#080e19d9;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.brand{font-weight:900;letter-spacing:1.5px;font-size:18px}
.brand b{color:var(--cyan)}
.online{font-size:11px;color:#77e6a5;display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#43e58c;box-shadow:0 0 12px #43e58c}
.wrap{max-width:1200px;margin:auto;padding:22px 16px 50px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:12px 0 22px;flex-wrap:wrap}
.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:3px;font-weight:800}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:7px 0}
.hero p{color:var(--muted);margin:0}
.tag{border:1px solid #1f5283;background:#0b1c31;color:#9bdcff;padding:8px 12px;border-radius:30px;font-size:11px;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,390px);gap:18px;align-items:start}
.panel{background:linear-gradient(145deg,#111d30,#0d1523);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 14px 40px #0005}
.panel h2{font-size:15px;margin:0 0 14px}
.boardtop,.boardbottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;color:var(--muted);font-size:12px}
.player{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:10px;background:#1d3e64;display:grid;place-items:center;font-weight:800;color:#bceaff}
.clock{font-variant-numeric:tabular-nums;background:#07101d;border:1px solid #29405e;border-radius:8px;padding:7px 10px;color:#fff;font-weight:800}
.clock.active{border-color:var(--cyan);box-shadow:0 0 14px #168cff55}
.board{width:min(100%,620px);aspect-ratio:1/1;height:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:4px solid #1c385a;border-radius:9px;overflow:hidden;margin:auto;box-shadow:0 0 28px #168cff22;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;aspect-ratio:1/1;font-size:clamp(20px,6.5vw,56px);line-height:1;user-select:none}
.light{background:#d9e7f4}
.dark{background:#46749c}
.sq.sel{box-shadow:inset 0 0 0 4px #39d6ff}
.sq.last{background:#9cbfdf}
.sq.hint:after{content:'';width:23%;height:23%;border-radius:50%;background:#102c49aa;position:absolute;pointer-events:none}
.sq.capture:after{content:'';position:absolute;inset:4px;border:4px solid #ffcf65;border-radius:50%}
.piece
